spring.application.name=ecom-app
server.port=${PORT:8089}

# Local development database. Override these with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep the JWT signing secret outside source control.
# The value must be a Base64-encoded key long enough for HS256.
jwt.secret=${JWT_SECRET}
